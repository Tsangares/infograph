<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1714">
  <title>clips — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      background: #1a1714; color: #f0ece4;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .login-box {
      width: 100%; max-width: 380px; padding: 24px;
    }
    .logo {
      font-family: 'Inter', sans-serif;
      font-size: 36px; color: #e8834a;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #6d6458; font-size: 14px;
      margin-bottom: 32px;
    }
    label {
      display: block; font-size: 12px; font-weight: 600;
      color: #a89f90; margin-bottom: 6px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    input[type="email"] {
      width: 100%; padding: 12px 14px;
      background: #232019; border: 1px solid rgba(255,245,230,0.08);
      border-radius: 10px; color: #f0ece4; font-size: 15px;
      font-family: inherit; outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: #e8834a; }
    input::placeholder { color: #6d6458; }
    button {
      width: 100%; padding: 12px; margin-top: 16px;
      background: #e8834a; color: #fff; border: none;
      border-radius: 10px; font-size: 15px; font-weight: 600;
      font-family: inherit; cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    button:hover { background: #f09560; }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .sent {
      text-align: center; padding: 20px 0;
    }
    .sent h2 {
      font-family: 'Inter', sans-serif;
      font-size: 20px; margin-bottom: 8px;
    }
    .sent p { color: #a89f90; font-size: 14px; }
    .error {
      color: #d15a50; font-size: 13px;
      margin-top: 8px;
    }
    .hidden { display: none; }
    .login-footer {
      text-align: center;
      margin-top: 32px;
    }
    .login-footer a {
      color: #6d6458;
      font-size: 13px;
      text-decoration: none;
      transition: color 0.15s;
    }
    .login-footer a:hover { color: #a89f90; }
  </style>
</head>
<body>
  <div class="login-box">
    <div id="email-state">
      <div class="logo">clips</div>
      <div class="subtitle">Admin dashboard</div>
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email" autofocus>
      <div id="error" class="error hidden"></div>
      <button id="submit-btn" onclick="sendLink()">Send login link</button>
    </div>
    <div id="sent-state" class="sent hidden">
      <h2>Check your email</h2>
      <p>We sent a login link. It expires in 15 minutes.</p>
    </div>
    <div class="login-footer">
      <a href="/about">About TKK</a>
    </div>
  </div>
  <script>
    const emailInput = document.getElementById('email');
    emailInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendLink(); });

    async function sendLink() {
      const email = emailInput.value.trim().toLowerCase();
      if (!email) return;
      const btn = document.getElementById('submit-btn');
      const err = document.getElementById('error');
      btn.disabled = true; err.classList.add('hidden');
      try {
        const res = await fetch('/api/auth/magic-link', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({email}),
        });
        if (!res.ok) {
          const data = await res.json();
          throw new Error(data.detail || 'Failed');
        }
        document.getElementById('email-state').classList.add('hidden');
        document.getElementById('sent-state').classList.remove('hidden');
      } catch (e) {
        err.textContent = e.message;
        err.classList.remove('hidden');
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
