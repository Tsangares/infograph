{% extends "base.html" %}
{% set active_page = 'chat' %}

{% block title %}clips — Chat{% endblock %}

{% block head %}
<style>
  main {
    padding-bottom: 0 !important;
    max-width: 100% !important;
    padding: 0 !important;
  }

  .chat-layout {
    display: flex;
    height: calc(100vh - 70px);
    height: calc(100dvh - 70px);
    overflow: hidden;
  }

  /* === SESSION SIDEBAR === */
  .chat-sidebar {
    width: 260px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .chat-sidebar-header {
    padding: 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .new-chat-btn {
    width: 100%;
    padding: 10px;
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-subtle);
    border: 1px solid rgba(232, 131, 74, 0.2);
    border-radius: var(--radius-sm);
    cursor: pointer;
  }
  .new-chat-btn:hover { opacity: 0.85; }

  .chat-sidebar-search {
    position: relative;
  }
  .chat-sidebar-search input {
    width: 100%;
    font-size: 13px;
    padding: 8px 12px 8px 32px;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    outline: none;
    font-family: var(--font-body);
  }
  .chat-sidebar-search input:focus { border-color: var(--accent); }
  .chat-sidebar-search input::placeholder { color: var(--text-muted); }
  .chat-sidebar-search svg {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    stroke: var(--text-muted);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    pointer-events: none;
  }

  .session-list {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: thin;
    padding: 4px 0;
  }

  .session-group-label {
    padding: 10px 12px 4px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
  }

  .session-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 10px 12px;
    cursor: pointer;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
    color: var(--text-dim);
    transition: background 0.12s;
  }
  .session-item:hover { background: var(--surface); }
  .session-item.active { background: var(--accent-glow); color: var(--accent); }

  .session-item-name {
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .session-item-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-muted);
  }

  .session-item-meta .msg-count {
    background: var(--surface);
    padding: 1px 6px;
    border-radius: 100px;
  }

  .session-delete {
    margin-left: auto;
    opacity: 0;
    font-size: 14px;
    color: var(--text-muted);
    cursor: pointer;
    padding: 0 4px;
  }
  .session-item:hover .session-delete { opacity: 0.6; }
  .session-delete:hover { opacity: 1 !important; color: var(--fail); }

  .session-screenplay-tag {
    font-family: var(--font-mono);
    font-size: 9px;
    padding: 1px 6px;
    border-radius: 100px;
    background: rgba(167, 139, 250, 0.14);
    color: #a78bfa;
  }

  /* === CHAT AREA === */
  .chat-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
  }

  .msg {
    max-width: 85%;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    word-wrap: break-word;
  }

  .msg-user {
    align-self: flex-end;
    background: var(--accent);
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .msg-assistant {
    align-self: flex-start;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    white-space: normal;
  }

  .msg-assistant code {
    background: rgba(0,0,0,0.3);
    padding: 1px 5px;
    border-radius: 3px;
    font-family: var(--font-mono);
    font-size: 12px;
  }
  .msg-assistant pre {
    background: rgba(0,0,0,0.3);
    padding: 10px;
    border-radius: 6px;
    overflow-x: auto;
    font-family: var(--font-mono);
    font-size: 12px;
    margin: 8px 0;
  }
  .msg-assistant pre code { background: none; padding: 0; }
  .msg-assistant ul { margin: 4px 0; padding-left: 20px; }
  .msg-assistant li { list-style: disc; }

  .msg-error {
    align-self: center;
    background: rgba(220, 50, 50, 0.1);
    border: 1px solid rgba(220, 50, 50, 0.2);
    color: #e55;
    font-size: 13px;
    padding: 8px 16px;
  }
  .msg-error-border { border: 1px solid rgba(220, 50, 50, 0.4) !important; }

  /* === ACTIVITY FEED === */
  .activity-feed {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 12px;
    font-size: 13px;
  }
  .activity-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 12px;
  }
  .activity-icon {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
  }
  .activity-item.running .activity-icon {
    color: var(--accent);
    animation: pulse-activity 1.4s ease-in-out infinite;
  }
  .activity-item.done .activity-icon { color: #4ade80; }
  .activity-item.error .activity-icon { color: #ef4444; }
  .activity-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @keyframes pulse-activity {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .activity-status-bar {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-muted);
    padding: 6px 0 2px;
    border-top: 1px solid var(--border);
    margin-top: 4px;
  }
  .current-tool-indicator {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--accent);
    padding: 4px 0;
    animation: pulse-activity 1.4s ease-in-out infinite;
  }
  .activity-error-info {
    margin-top: 8px;
    padding: 8px 12px;
    background: rgba(220, 50, 50, 0.08);
    border: 1px solid rgba(220, 50, 50, 0.2);
    border-radius: 6px;
    font-size: 12px;
    color: #e55;
  }
  .activity-error-info .completed-list {
    color: var(--text-dim);
    margin-top: 4px;
  }

  .retry-btn {
    display: inline-block;
    margin-left: 12px;
    padding: 4px 12px;
    font-size: 12px;
    font-family: var(--font-body);
    color: #e55;
    background: rgba(220, 50, 50, 0.1);
    border: 1px solid rgba(220, 50, 50, 0.3);
    border-radius: var(--radius-sm);
    cursor: pointer;
  }
  .retry-btn:hover { background: rgba(220, 50, 50, 0.2); }

  .typing-indicator {
    align-self: flex-start;
    color: var(--text-muted);
    font-size: 13px;
    padding: 10px 16px;
    display: none;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    border-bottom-left-radius: 4px;
  }
  .typing-indicator.active { display: flex; }

  .chat-empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 15px;
    text-align: center;
    padding: 40px;
  }
  .chat-empty p { margin: 8px 0; }
  .chat-empty .hint { font-size: 13px; color: var(--text-dim); }

  /* --- INPUT --- */
  .attached-files {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    padding: 0 20px;
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
  }
  .attached-file {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 100px;
    background: var(--accent-subtle);
    border: 1px solid rgba(232, 131, 74, 0.2);
    color: var(--accent);
  }
  .attached-file .remove-file {
    cursor: pointer;
    opacity: 0.6;
    font-size: 14px;
    line-height: 1;
  }
  .attached-file .remove-file:hover { opacity: 1; }

  .chat-input-wrap {
    padding: 12px 20px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: flex-end;
    max-width: 840px;
    width: 100%;
    margin: 0 auto;
  }

  .chat-input {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    min-height: 44px;
    max-height: 160px;
    line-height: 1.4;
  }
  .chat-input:focus { outline: none; border-color: var(--accent); }

  .send-btn {
    padding: 10px 20px;
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    white-space: nowrap;
    height: 44px;
  }
  .send-btn:hover { opacity: 0.9; }
  .send-btn:disabled { opacity: 0.5; cursor: default; }

  .stop-btn {
    padding: 10px 20px;
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    color: #e55;
    background: rgba(220, 50, 50, 0.1);
    border: 1px solid rgba(220, 50, 50, 0.2);
    border-radius: var(--radius-sm);
    cursor: pointer;
    height: 44px;
    display: none;
  }

  .attach-btn {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    color: var(--text-dim);
    transition: all 0.15s;
  }
  .attach-btn:hover { border-color: var(--border-hover); color: var(--text); }
  .attach-btn svg {
    width: 18px; height: 18px;
    stroke: currentColor; fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }

  /* === MOBILE === */
  @media (max-width: 767px) {
    .chat-layout {
      height: calc(100vh - var(--bottom-nav-h) - var(--safe-bottom));
      height: calc(100dvh - var(--bottom-nav-h) - var(--safe-bottom));
    }
    .chat-sidebar {
      position: fixed;
      top: 0; left: 0;
      bottom: calc(var(--bottom-nav-h) + var(--safe-bottom));
      width: 280px;
      z-index: 300;
      background: var(--bg);
      transform: translateX(-100%);
      transition: transform 0.25s ease;
    }
    .chat-sidebar.open { transform: translateX(0); }
    .chat-messages { padding: 12px; }
    .chat-input-wrap { padding: 8px 12px; }
    .chat-input { font-size: 16px; }
    .msg { max-width: 95%; }
    .mobile-history-btn { display: flex !important; }
  }

  .mobile-history-btn {
    display: none;
    position: fixed;
    top: 68px;
    left: 12px;
    width: 40px;
    height: 40px;
    border-radius: var(--radius-sm);
    background: var(--bg-raised);
    border: 1px solid var(--border);
    cursor: pointer;
    z-index: 150;
    align-items: center;
    justify-content: center;
  }
  .mobile-history-btn svg {
    width: 20px; height: 20px;
    stroke: var(--text-dim); fill: none;
    stroke-width: 2; stroke-linecap: round;
  }
  .sidebar-overlay {
    position: fixed;
    inset: 0;
    z-index: 250;
    background: rgba(0,0,0,0.5);
    display: none;
  }
  .sidebar-overlay.open { display: block; }
  @media (max-width: 767px) {
    .sidebar-overlay { bottom: calc(var(--bottom-nav-h) + var(--safe-bottom)); }
  }
</style>
{% endblock %}

{% block content %}
<div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

<div class="chat-layout">
  <!-- SESSION SIDEBAR -->
  <aside class="chat-sidebar" id="chat-sidebar">
    <div class="chat-sidebar-header">
      <button class="new-chat-btn" onclick="newSession()">+ New Chat</button>
      <div class="chat-sidebar-search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" id="session-search" placeholder="Search chats..." oninput="filterSessions()">
      </div>
    </div>
    <div class="session-list" id="session-list"></div>
  </aside>

  <!-- CHAT AREA -->
  <div class="chat-main">
    <div class="chat-messages" id="chat-messages">
      <div class="chat-empty" id="chat-empty">
        <div>
          <p style="font-size:20px;margin-bottom:4px">Chat</p>
        </div>
      </div>
      <div class="typing-indicator" id="typing">
        <svg width="24" height="24" viewBox="0 0 24 24" style="flex-shrink:0">
          <circle cx="4" cy="12" r="2.5" fill="var(--accent)"><animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite" begin="0s"/></circle>
          <circle cx="12" cy="12" r="2.5" fill="var(--accent)"><animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite" begin="0.2s"/></circle>
          <circle cx="20" cy="12" r="2.5" fill="var(--accent)"><animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite" begin="0.4s"/></circle>
        </svg>
        <span id="typing-label">Working</span><span id="typing-time"></span>
      </div>
    </div>
    <div class="attached-files" id="attached-files"></div>
    <div class="chat-input-wrap">
      <input type="file" id="file-input" multiple style="display:none" onchange="handleFileSelect(this)">
      <button class="attach-btn" onclick="document.getElementById('file-input').click()" title="Attach file">
        <svg viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <textarea class="chat-input" id="chat-input" placeholder="type here" rows="1"
                onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMessage()">Send</button>
      <button class="stop-btn" id="stop-btn" onclick="stopSession()">Stop</button>
    </div>
  </div>
</div>

<button class="mobile-history-btn" onclick="toggleSidebar()">
  <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
</button>
{% endblock %}

{% block scripts %}
<script>
  let currentSessionId = null;
  let isStreaming = false;
  let lastUserMessage = null;
  let userAtBottom = true;
  let attachedFiles = [];
  let pollTimer = null;
  let assistantDiv = null;
  let allSessions = [];

  function esc(t) {
    const d = document.createElement('div');
    d.textContent = t;
    return d.innerHTML;
  }

  // ============ MARKDOWN ============

  function renderMarkdown(text) {
    let html = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
    html = html.replace(/^[\-\*]\s+(.+)$/gm, '<li>$1</li>');
    html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
    html = html.replace(/\n/g, '<br>');
    html = html.replace(/<pre><code>([\s\S]*?)<\/code><\/pre>/g, (m, code) => {
      return '<pre><code>' + code.replace(/<br>/g, '\n') + '</code></pre>';
    });
    return html;
  }

  // ============ SESSION SIDEBAR ============

  async function loadSessions() {
    try {
      const res = await fetch('/api/studio/sessions');
      if (!res.ok) return;
      const data = await res.json();
      allSessions = data.sessions;
      renderSessionList(allSessions);
    } catch {}
  }

  function renderSessionList(sessions) {
    const list = document.getElementById('session-list');
    const query = (document.getElementById('session-search')?.value || '').toLowerCase();

    let items = sessions;
    if (query) {
      items = items.filter(s => (s.name || '').toLowerCase().includes(query));
    }

    // Group: general (no screenplay) vs linked
    const general = items.filter(s => !s.screenplay_filename);
    const linked = items.filter(s => s.screenplay_filename);

    // Group linked by screenplay
    const byScreenplay = {};
    for (const s of linked) {
      const key = s.screenplay_filename;
      if (!byScreenplay[key]) byScreenplay[key] = [];
      byScreenplay[key].push(s);
    }

    let html = '';

    if (general.length) {
      html += '<div class="session-group-label">General</div>';
      for (const s of general) {
        html += renderSessionItem(s);
      }
    }

    for (const [filename, sessions] of Object.entries(byScreenplay)) {
      const label = filename.replace('_manim.py', '').replace('.py', '').replace(/_/g, ' ');
      html += `<div class="session-group-label">${esc(label)}</div>`;
      for (const s of sessions) {
        html += renderSessionItem(s);
      }
    }

    list.innerHTML = html || '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px">No chats yet</div>';
  }

  function renderSessionItem(s) {
    const active = s.id === currentSessionId ? ' active' : '';
    const name = esc(s.name || 'Untitled');
    const ago = timeAgo(s.updated_at);
    const msgs = s.message_count || 0;
    return `<button class="session-item${active}" onclick="loadSession('${s.id}')">
      <div class="session-item-name">${name}</div>
      <div class="session-item-meta">
        <span class="msg-count">${msgs} msg${msgs !== 1 ? 's' : ''}</span>
        <span>${ago}</span>
        ${s.screenplay_filename ? `<span class="session-screenplay-tag">${esc(s.screenplay_filename.replace('_manim.py','').replace('.py',''))}</span>` : ''}
        <span class="session-delete" onclick="event.stopPropagation();deleteSession('${s.id}')" title="Delete">&times;</span>
      </div>
    </button>`;
  }

  const TYPING_HTML = `<div class="typing-indicator" id="typing">
    <svg width="24" height="24" viewBox="0 0 24 24" style="flex-shrink:0">
      <circle cx="4" cy="12" r="2.5" fill="var(--accent)"><animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite" begin="0s"/></circle>
      <circle cx="12" cy="12" r="2.5" fill="var(--accent)"><animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite" begin="0.2s"/></circle>
      <circle cx="20" cy="12" r="2.5" fill="var(--accent)"><animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite" begin="0.4s"/></circle>
    </svg>
    <span id="typing-label">Working</span><span id="typing-time"></span>
  </div>`;

  function ensureTypingIndicator() {
    const container = document.getElementById('chat-messages');
    if (container && !document.getElementById('typing')) {
      container.insertAdjacentHTML('beforeend', TYPING_HTML);
    }
  }

  function timeAgo(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr + 'Z');
    const now = new Date();
    const diff = (now - d) / 1000;
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  function filterSessions() {
    renderSessionList(allSessions);
  }

  // ============ SESSION ACTIONS ============

  function updateUrl(sessionId) {
    const url = new URL(window.location);
    if (sessionId) {
      url.searchParams.set('chat_id', sessionId);
    } else {
      url.searchParams.delete('chat_id');
    }
    history.replaceState(null, '', url);
  }

  async function newSession() {
    stopPolling();
    setStreaming(false);
    currentSessionId = null;
    assistantDiv = null;
    updateUrl(null);
    document.getElementById('chat-messages').innerHTML = `<div class="chat-empty" id="chat-empty"><div>
      <p style="font-size:20px;margin-bottom:4px">Chat</p>
    </div></div>`;
    ensureTypingIndicator();
    document.getElementById('chat-input').focus();
    renderSessionList(allSessions);
    closeSidebar();
  }

  async function loadSession(id) {
    stopPolling();
    setStreaming(false);
    currentSessionId = id;
    assistantDiv = null;
    updateUrl(id);

    const container = document.getElementById('chat-messages');
    container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-dim)"><span class="spinner"></span></div>';

    try {
      const res = await fetch(`/api/studio/sessions/${id}/messages`);
      const data = await res.json();
      container.innerHTML = '';
      ensureTypingIndicator();

      if (data.messages.length === 0) {
        container.innerHTML = '<div class="chat-empty"><div><p class="hint">Empty conversation. Start typing below.</p></div></div>';
        ensureTypingIndicator();
      } else {
        for (const msg of data.messages) {
          appendMessage(msg.role, msg.content);
        }
      }

      // Check if Claude is running
      const pollRes = await fetch(`/api/studio/sessions/${id}/poll`);
      const pollData = await pollRes.json();
      if (pollData.status === 'running') {
        assistantDiv = appendMessage('assistant', pollData.content || '');
        startPolling();
      }
    } catch {
      container.innerHTML = '<div class="chat-empty" style="color:var(--fail)">Failed to load session</div>';
      ensureTypingIndicator();
    }

    renderSessionList(allSessions);
    closeSidebar();
  }

  async function deleteSession(id) {
    if (!confirm('Delete this chat?')) return;
    try {
      await fetch(`/api/studio/sessions/${id}`, { method: 'DELETE' });
      if (currentSessionId === id) {
        newSession();
      }
      allSessions = allSessions.filter(s => s.id !== id);
      renderSessionList(allSessions);
    } catch {}
  }

  // ============ CHAT ============

  function isNearBottom() {
    const el = document.getElementById('chat-messages');
    return el.scrollHeight - el.scrollTop - el.clientHeight < 100;
  }

  function scrollToBottom() {
    const el = document.getElementById('chat-messages');
    el.scrollTop = el.scrollHeight;
  }

  function appendMessage(role, content) {
    const container = document.getElementById('chat-messages');
    const empty = container.querySelector('.chat-empty');
    if (empty) empty.remove();

    const div = document.createElement('div');
    div.className = 'msg msg-' + role;

    if (role === 'assistant') {
      div.innerHTML = renderMarkdown(content);
    } else if (role === 'error') {
      div.textContent = content;
      if (lastUserMessage) {
        const btn = document.createElement('button');
        btn.className = 'retry-btn';
        btn.textContent = 'Retry';
        btn.onclick = () => {
          div.remove();
          document.getElementById('chat-input').value = lastUserMessage;
          sendMessage();
        };
        div.appendChild(btn);
      }
    } else {
      div.textContent = content;
    }

    container.appendChild(div);
    scrollToBottom();
    return div;
  }

  async function handleFileSelect(input) {
    for (const file of input.files) {
      const form = new FormData();
      form.append('file', file);
      try {
        const res = await fetch('/api/upload', { method: 'POST', body: form });
        const data = await res.json();
        attachedFiles.push({ name: file.name, path: data.path });
        renderAttachedFiles();
        showToast(`Uploaded ${file.name}`, 'success');
      } catch {
        showToast(`Failed to upload ${file.name}`, 'error');
      }
    }
    input.value = '';
  }

  function removeFile(idx) {
    attachedFiles.splice(idx, 1);
    renderAttachedFiles();
  }

  function renderAttachedFiles() {
    const container = document.getElementById('attached-files');
    container.innerHTML = attachedFiles.map((f, i) => {
      return `<span class="attached-file">${esc(f.name)} <span class="remove-file" onclick="removeFile(${i})">&times;</span></span>`;
    }).join('');
  }

  async function sendMessage() {
    const input = document.getElementById('chat-input');
    let message = input.value.trim();

    if (attachedFiles.length > 0) {
      const filePaths = attachedFiles.map(f =>
        `[Attached file: ${f.name}] — Read it at: ${f.path}`
      ).join('\n');
      message = filePaths + (message ? '\n\n' + message : '\n\nPlease read the attached file(s) and review them.');
    }

    if (!message || isStreaming) return;

    // Create session if needed
    if (!currentSessionId) {
      const res = await fetch('/api/studio/sessions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: input.value.trim().slice(0, 60) || 'New chat' }),
      });
      const data = await res.json();
      currentSessionId = data.id;
      updateUrl(data.id);
      loadSessions(); // refresh sidebar
    }

    lastUserMessage = message;
    let displayMsg = input.value.trim();
    if (attachedFiles.length > 0) {
      const names = attachedFiles.map(f => f.name).join(', ');
      displayMsg = (displayMsg ? displayMsg + '\n' : '') + '[Attached: ' + names + ']';
    }
    appendMessage('user', displayMsg || message);
    input.value = '';
    input.style.height = 'auto';
    attachedFiles = [];
    renderAttachedFiles();

    try {
      const res = await fetch(`/api/studio/sessions/${currentSessionId}/message`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message }),
      });
      let data;
      try {
        data = await res.json();
      } catch {
        appendMessage('error', `Server error (${res.status})`);
        return;
      }
      if (res.status === 409) {
        appendMessage('error', data.error || 'Claude is already working');
        return;
      }
      if (data.detail) {
        appendMessage('error', data.detail);
        return;
      }
      if (data.status === 'started') {
        assistantDiv = null;
        startPolling();
      }
    } catch (err) {
      appendMessage('error', 'Connection error: ' + err.message);
    }
  }

  // ============ POLLING ============

  function startPolling() {
    setStreaming(true);
    if (!assistantDiv) {
      assistantDiv = appendMessage('assistant', '');
    }
    pollTimer = setInterval(pollForResponse, 1500);
  }

  function stopPolling() {
    if (pollTimer) {
      clearInterval(pollTimer);
      pollTimer = null;
    }
    assistantDiv = null;
  }

  function renderActivityIcon(status) {
    if (status === 'running') return '<span class="activity-icon">&#9679;</span>';
    if (status === 'done') return '<span class="activity-icon">&#10003;</span>';
    if (status === 'error') return '<span class="activity-icon">&#10007;</span>';
    return '<span class="activity-icon">&#8226;</span>';
  }

  function renderActivityFeed(data) {
    let html = '';

    // Activity feed
    if (data.activities && data.activities.length > 0) {
      html += '<div class="activity-feed">';
      for (const act of data.activities) {
        const statusClass = act.status || 'running';
        html += `<div class="activity-item ${statusClass}">
          ${renderActivityIcon(act.status)}
          <span class="activity-label">${esc(act.label || act.name || 'Working...')}</span>
        </div>`;
      }
      html += '</div>';
    }

    // Current tool indicator
    if (data.current_tool) {
      html += `<div class="current-tool-indicator">${esc(data.current_tool.label || data.current_tool.name)}...</div>`;
    }

    // Text response (streams in)
    if (data.content) {
      html += '<div class="response-text">' + renderMarkdown(data.content) + '</div>';
    }

    // Status bar
    html += `<div class="activity-status-bar">${data.elapsed || 0}s`;
    if (data.cost_usd) html += ` &middot; $${data.cost_usd.toFixed(3)}`;
    html += '</div>';

    return html;
  }

  function renderErrorInfo(data) {
    let html = '<div class="activity-error-info">';
    const done = (data.activities || []).filter(a => a.status === 'done');
    const pending = (data.activities || []).filter(a => a.status === 'running');

    if (data.status === 'timeout') {
      html += `<strong>Timed out after ${data.elapsed || 900}s.</strong>`;
    } else if (data.error && data.error.includes('budget')) {
      html += `<strong>Budget limit reached.</strong>`;
    } else {
      html += `<strong>Error: ${esc(data.error || 'Unknown error')}</strong>`;
    }

    if (done.length > 0) {
      html += `<div class="completed-list">Completed: ${done.map(a => esc(a.label || a.name)).join(', ')}</div>`;
    }
    if (pending.length > 0) {
      html += `<div class="completed-list">Interrupted: ${pending.map(a => esc(a.label || a.name)).join(', ')}</div>`;
    }

    html += '</div>';
    return html;
  }

  async function pollForResponse() {
    if (!currentSessionId) return;
    try {
      const res = await fetch(`/api/studio/sessions/${currentSessionId}/poll`);
      const data = await res.json();

      if (assistantDiv) {
        if (data.status === 'running' || data.status === 'stalled') {
          // Show activity feed while running
          assistantDiv.innerHTML = renderActivityFeed(data);
          if (data.status === 'stalled') {
            assistantDiv.innerHTML += `<div class="activity-stall-warning" style="color:var(--warn);padding:8px 12px;margin-top:8px;font-size:13px;background:rgba(200,150,0,0.1);border-radius:8px">
              &#9888; ${esc(data.error || 'Process appears stalled')} — <a href="#" onclick="event.preventDefault();stopSession();setStreaming(false);showToast('Stopped','info')">Stop</a> or wait
            </div>`;
          }
        } else if (data.content) {
          // Done — show just the final text
          assistantDiv.innerHTML = renderMarkdown(data.content);
        }
        if (userAtBottom) scrollToBottom();
      }

      // Update typing indicator with current tool label
      const typingLabel = document.getElementById('typing-label');
      const timeEl = document.getElementById('typing-time');
      if (data.status === 'running' || data.status === 'stalled') {
        const label = data.current_tool ? (data.current_tool.label || data.current_tool.name) : (data.status === 'stalled' ? 'Stalled' : 'Working');
        if (typingLabel) typingLabel.textContent = label;
        if (data.elapsed && timeEl) timeEl.textContent = ` ${data.elapsed}s`;
      }

      if (data.status !== 'running' && data.status !== 'stalled') {
        // Show error/timeout info if applicable
        if ((data.status === 'error' || data.status === 'timeout') && assistantDiv) {
          assistantDiv.classList.add('msg-error-border');
          let finalHtml = data.content ? renderMarkdown(data.content) : '';
          if (data.error) {
            finalHtml += `<div class="activity-error-msg" style="color:var(--fail);padding:8px 12px;margin-top:8px;font-size:13px;background:rgba(200,50,50,0.1);border-radius:8px">${esc(data.error)}</div>`;
          }
          if (data.activities && data.activities.length > 0) {
            finalHtml += renderErrorInfo(data);
          }
          assistantDiv.innerHTML = finalHtml;
        }
        stopPolling();
        setStreaming(false);
        loadSessions();
      }
    } catch {}
  }

  async function stopSession() {
    if (!currentSessionId) return;
    await fetch(`/api/studio/sessions/${currentSessionId}/stop`, { method: 'POST' });
  }

  function setStreaming(active) {
    isStreaming = active;
    document.getElementById('send-btn').style.display = active ? 'none' : '';
    document.getElementById('stop-btn').style.display = active ? '' : 'none';
    const typingEl = document.getElementById('typing');
    if (typingEl) typingEl.className = 'typing-indicator' + (active ? ' active' : '');
    document.getElementById('chat-input').disabled = active;
    if (active) {
      scrollToBottom();
    } else {
      const timeEl = document.getElementById('typing-time');
      if (timeEl) timeEl.textContent = '';
    }
  }

  // ============ MOBILE ============

  function toggleSidebar() {
    document.getElementById('chat-sidebar').classList.toggle('open');
    document.getElementById('sidebar-overlay').classList.toggle('open');
  }

  function closeSidebar() {
    document.getElementById('chat-sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.remove('open');
  }

  // ============ INIT ============

  document.getElementById('chat-input').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 160) + 'px';
  });

  document.getElementById('chat-messages').addEventListener('scroll', () => {
    userAtBottom = isNearBottom();
  });

  loadSessions().then(() => {
    const params = new URLSearchParams(window.location.search);
    const chatId = params.get('chat_id');
    if (chatId) loadSession(chatId);
  });
</script>
{% endblock %}
