  <path d="M200 50 C100 50 40 120 40 200 C40 260 70 310 120 340 L120 380 C120 420 160 450 200 450 C240 450 280 420 280 380 L280 340 C330 310 360 260 360 200 C360 120 300 50 200 50Z" stroke-width="3"/>
